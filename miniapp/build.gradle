plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mini'
    compileSdk 34

    defaultConfig {
        applicationId 'com.mini'
        minSdk 24
        /*
         * 27 on purpose: ParcelFileDescriptor.fromSocket() goes through
         * Socket.getFileDescriptor$(), which is a hidden API. At targetSdk 28+
         * the non-SDK restrictions hand back null and the churn detector can
         * never obtain a file descriptor.
         */
        targetSdk 27
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}