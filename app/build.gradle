plugins {
    id 'com.android.application'
}

android {
    namespace 'com.inj'
    compileSdk 34

    defaultConfig {
        applicationId 'com.inj'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'

        // The device is aarch64 only, and the native helpers talk to kernels
        // through raw syscalls, so there is nothing to gain from shipping a
        // 32 bit build.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    ndkVersion '26.1.10909125'
}